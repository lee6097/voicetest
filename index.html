<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>톡톡케어</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Arial', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #chatbox {
      width: 100vw;
      max-width: 600px;
      height: calc(var(--vh, 1vh) * 100); /* 수정된 부분 */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: white;
      padding: 10px;
      box-sizing: border-box;
    }
    #chat {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-grow: 1;
      margin-bottom: 10px;
    }
    .bubble-container {
      display: inline-flex; /* ✅ block → inline-block처럼 동작 */
      align-items: flex-end;
      margin: 8px 0;
    }
    .bubble {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 65%;
      word-wrap: break-word;
      position: relative;
    }
    .user {
      background: #d1e7ff;
      align-self: flex-end;
      margin-left: auto;
    }
    .ai {
      background: #eee;
      align-self: flex-start;
      margin-right: 1px;
    }
    #inputForm {
      display: flex;
      gap: 8px;
      position: relative; /* ✅ 추가: 말풍선 위치의 기준점 */
    }
    #userInput {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.9em;
      line-height: 1.4;
      resize: none;
      overflow-y: auto;
      min-height: 20px;
      max-height: 60px;
      height: auto;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button[type="submit"] {
      background: #0078d7;
      color: white;
    }
    button[type="submit"]:hover {
      background: #005fa3;
    }
    #micBtn {
      background: #28a745;
      color: white;
    }
    #micBtn:hover {
      background: #1e7e34;
    }
    .reset-btn {
      background: #888;
      color: white;
    }
    .reset-btn:hover {
      background: #666;
    }
    .copy-btn {
      font-size: 10px;
      padding: 1px 4px;
      background: transparent;
      color: #666;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      height: 20px;
      margin: 0 4px;
      flex-shrink: 0;
    }
    .copy-btn:hover {
      background: #eee;
    }
    .button-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }
    .small-btn {
      font-size: 0.8em;
      padding: 6px 10px;
      flex: 1;
      white-space: nowrap;
    }

    @keyframes blinkInput {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.2; }
    }

    #userInput.listening {
      animation: blinkInput 1s infinite;
    }

    .button-column {
      display: flex;
      flex-direction: column;
      gap: 6px; /* 버튼들 사이 간격 */
      margin-left: 8px;
    }

    /* ✅ 추가: 음성 인식 팝업 스타일 */
    #voice-popup {
      display: none; /* 평소에는 숨김 */
      position: fixed; /* 화면 중앙에 고정 */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.75); /* 반투명 검은 배경 */
      color: white;
      padding: 25px 30px;
      border-radius: 15px;
      text-align: center;
      z-index: 1000;
      font-size: 1.1em;
    }
    #voice-popup div:first-child {
      font-size: 2em; /* 마이크 아이콘 크기 */
      margin-bottom: 10px;
    }

    /* ✅ 추가: 중지 버튼 안내 말풍선 스타일 */
    #stop-tooltip {
      display: none; /* 평소에는 숨김 */
      position: absolute; /* inputForm 기준 절대 위치 */
      bottom: 110%; /* 버튼 바로 위 */
      right: 5px; /* 오른쪽 정렬 */
      background-color: #0078d7;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9em;
      white-space: nowrap; /* 줄바꿈 방지 */
      z-index: 1001;
    }

    /* ✅ 추가: 말풍선 꼬리 만들기 */
    #stop-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 50px; /* 꼬리 위치 조절 */
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #0078d7 transparent transparent transparent;
    }
    
  </style>

  <script>
    function setVhUnit() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    window.addEventListener('resize', setVhUnit);
    window.addEventListener('load', setVhUnit);
  </script>

</head>
<body>
    <div id="voice-popup" style="display: none;">
    <div>🎤</div>
    <div>음성 인식이 진행중입니다...</div>
  </div>

  <div id="chatbox">
    <div id="chat"></div>
    <form id="inputForm">
      <textarea id="userInput" rows="1" enterkeyhint="newline"></textarea>
      <button type="button" id="micBtn" title="음성 입력">🎤</button>
      <button type="submit" id="sendBtn" title="보내기">✉️</button>
      <div id="stop-tooltip" style="display: none;">
        다 말씀하셨나요? 버튼을 눌러 전송해주세요.
      </div>
    </form>
    <div class="button-row">
      <button class="reset-btn small-btn" onclick="location.reload()">🔄 대화 초기화</button>
      <button class="allcopy-btn small-btn" onclick="copyAll()">📝 전체 복사</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('inputForm');
    const userInput = document.getElementById('userInput');
    const micBtn = document.getElementById('micBtn');
    const sendBtn = document.getElementById('sendBtn');
    const voicePopup = document.getElementById('voice-popup'); // ✅ 추가
    const stopTooltip = document.getElementById('stop-tooltip'); // ✅ 추가

    const messages = [];

    window.addEventListener('DOMContentLoaded', () => {
      const welcome = "반갑습니다. 똑똑한 AI 건강 상담사 톡톡케어입니다. 현재 가장 불편한 증상 또는 궁금한 건강지식을 입력해주세요.\n\n※톡톡케어 건강상담은 전문적인 의학적 진단이나 처방을 대체할 수 없습니다. 중요한 건강 문제는 반드시 의사, 약사 등 전문가와 상담하시기 바랍니다.";
      appendBubble(welcome, 'ai');
    });

    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text || text === "🗣️ 음성을 입력하세요...") return;

      appendBubble(text, 'user');
      messages.push({ role: 'user', content: text });
      userInput.value = '';
      userInput.disabled = true;

      appendBubble('⏳ 답변 작성 중... 최대 1분까지 소요될 수 있습니다.', 'ai');

      try {
        const res = await fetch('https://talktalkcare-server.onrender.com/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        const data = await res.json();
        removeLastBubble();
        messages.push({ role: 'assistant', content: data.reply });
        appendBubble(data.reply, 'ai');
      } catch (err) {
        removeLastBubble();
        appendBubble('⚠️ 메시지 전송 중 오류가 발생했습니다.\n\n<해결방법>\n\n1) 1분 뒤 다시 시도해주세요.\n\n2) 네트워크 상태를 확인해주세요.\n\n3) 개발자에게 문의해주세요.', 'ai');
      } finally {
        userInput.disabled = false;
        userInput.focus();
      }
    };

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(text));
      return div.innerHTML.replace(/\n/g, "<br>");
    }

    function appendBubble(text, sender) {
      const container = document.createElement('div');
      container.className = `bubble-container ${sender}-container`;

      const bubble = document.createElement('div');
      bubble.className = `bubble ${sender}`;
      bubble.innerHTML = escapeHtml(text);

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = '📋 복사';
      copyBtn.onclick = () => copyToClipboard(text);

      const speakBtn = document.createElement('button');
      speakBtn.className = 'copy-btn';
      speakBtn.textContent = '📢 음성';
      speakBtn.onclick = () => speakText(text, speakBtn);

      const btnColumn = document.createElement('div');
      btnColumn.className = 'button-column';
      btnColumn.appendChild(speakBtn);
      btnColumn.appendChild(copyBtn);

      if (sender === 'user') {
        container.appendChild(bubble);
      } else {
        container.appendChild(bubble);
        container.appendChild(btnColumn);
      }

      chat.appendChild(container);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeLastBubble() {
      const last = chat.lastElementChild;
      if (last) chat.removeChild(last);
    }

    function copyToClipboard(text) {
      const temp = document.createElement('textarea');
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
    }

    let currentSpeakingBtn = null;

    function speakText(rawText, button) {
      if (!('speechSynthesis' in window)) {
        alert('🔈 음성 합성을 지원하지 않는 브라우저입니다.');
        return;
      }

      if (currentSpeakingBtn === button) {
        stopSpeech();
        return;
      }

      if (currentSpeakingBtn) {
        window.speechSynthesis.cancel();
        resetSpeechState();
      }

      setTimeout(() => {
        currentSpeakingBtn = button;
        button.textContent = '⏹️ 중지';

        const cleaned = rawText
          .replace(/\([^)]*\)/g, '')         
          .replace(/[*#\-⚠️⏳]/g, '')         
          .trim();                           

        const sentences = cleaned
          .split(/[\.\!\?]+[\s\n]+|\n+/)
          .filter(s => s.trim().length > 0);

        if (sentences.length === 0) {
          resetSpeechState();
          return;
        }

        let index = 0;

        function speakNext() {
          if (index >= sentences.length) {
            resetSpeechState();
            return;
          }

          const utter = new SpeechSynthesisUtterance(sentences[index].trim());
          utter.lang = 'ko-KR';

          utter.onend = () => {
            index++;
            speakNext();
          };

          utter.onerror = () => {
            resetSpeechState();
          };

          window.speechSynthesis.speak(utter);
        }

        speakNext();
      }, 100);
    }

    function stopSpeech() {
      window.speechSynthesis.cancel();
      resetSpeechState();
    }

    function resetSpeechState() {
      if (currentSpeakingBtn) {
        currentSpeakingBtn.textContent = '📢 음성';
        currentSpeakingBtn = null;
      }
    }

    window.addEventListener('beforeunload', () => {
      window.speechSynthesis.cancel();
    });

    function copyAll() {
      let allMessages = '';
      const containers = document.getElementsByClassName('bubble-container');

      for (let container of containers) {
        const bubble = container.querySelector('.bubble');
        if (!bubble) continue;

        const isUser = bubble.classList.contains('user');
        const label = isUser ? '사용자' : '톡톡케어';
        const text = bubble.innerText.trim();

        allMessages += `${label}: ${text}\n\n`;
      }

      copyToClipboard(allMessages.trim());
    }

    // 🎤 음성 인식
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
        recognition.lang = 'ko-KR';
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        let isListening = false;
        let isManuallyStopped = false;
        let fullTranscript = '';

        micBtn.addEventListener('click', () => {
            if (!recognition) return;

            if (isListening) {
                // 사용자가 수동으로 중단
                isManuallyStopped = true;
                recognition.stop();
                return;
            }

            // 음성 인식 시작
            isManuallyStopped = false;
            isListening = true;
            fullTranscript = '';
            micBtn.disabled = false;
            micBtn.textContent = '⏹️';
            userInput.value = '';
            userInput.classList.add('listening');
            userInput.disabled = true;
            sendBtn.disabled = true;
            voicePopup.style.display = 'block'; // ✅ 추가: 팝업 보이기
            stopTooltip.style.display = 'block'; // ✅ 추가: 말풍선 보이기
            recognition.start();
        });

        recognition.addEventListener('result', (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                transcript += event.results[i][0].transcript;
            }

            if (event.results[event.results.length - 1].isFinal) {
                fullTranscript += transcript;
            }

            userInput.value = fullTranscript + (!event.results[event.results.length - 1].isFinal ? transcript : '');
        });

        recognition.addEventListener('end', () => {
            voicePopup.style.display = 'none'; // ✅ 추가: 팝업 숨기기
            stopTooltip.style.display = 'none'; // ✅ 추가: 말풍선 숨기기

            if (isManuallyStopped) {
                // 수동 중단이면 입력 전송
                micBtn.disabled = false;
                micBtn.textContent = '🎤';
                userInput.classList.remove('listening');
                userInput.disabled = false;
                sendBtn.disabled = false;
                isListening = false;

                if (userInput.value.trim()) {
                    form.dispatchEvent(new Event('submit'));
                } else {
                    userInput.value = '';
                }
            } else {
                // 자동 종료된 경우: 공백 추가 후 다시 시작
                fullTranscript += ' ';
                recognition.start();
                // ✅ 자동 재시작 시에는 팝업과 말풍선을 다시 띄움
                voicePopup.style.display = 'block';
                stopTooltip.style.display = 'block';
            }
        });

        recognition.addEventListener('error', (e) => {
            alert('🎤 음성 인식 오류: ' + e.error);
            voicePopup.style.display = 'none'; // ✅ 추가: 에러 시 팝업 숨기기
            stopTooltip.style.display = 'none'; // ✅ 추가: 에러 시 말풍선 숨기기
            micBtn.disabled = false;
            micBtn.textContent = '🎤';
            userInput.classList.remove('listening');
            userInput.disabled = false;
            sendBtn.disabled = false;
            isListening = false;
        });

    } else {
        micBtn.disabled = true;
        micBtn.title = "브라우저에서 음성 인식을 지원하지 않습니다";
    }

    
    // ⌨️ 엔터 키 처리
    document.addEventListener('DOMContentLoaded', () => {
      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
      userInput.addEventListener('keydown', function (e) {
        if (!isMobile && e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.dispatchEvent(new Event('submit'));
        }
      });

      userInput.addEventListener('input', () => {
        userInput.style.height = 'auto';
        const computed = window.getComputedStyle(userInput);
        const maxHeight = parseFloat(computed.maxHeight);
        const newHeight = Math.min(userInput.scrollHeight, maxHeight);
        userInput.style.height = newHeight + 'px';
        userInput.style.overflowY = userInput.scrollHeight > maxHeight ? 'auto' : 'hidden';
      });
    });
  </script>

      isFormDirty = true;
